# WattWise AI — local development infrastructure (Azure-native-local stack)
# Start:  docker compose up -d
# Stop:   docker compose down
# Requires Docker Desktop running.

services:

  # ---- IoT Hub replacement (MQTT broker) ----
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: wattwise-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- High-performance time-series analytics store ----
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: wattwise-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./analytics/clickhouse:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: wattwise
      CLICKHOUSE_USER: wattwise
      CLICKHOUSE_PASSWORD: wattwise_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Real-time operations dashboards ----
  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: wattwise-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: wattwise_dev
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---- Local email capture (replaces Azure Communication Services) ----
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wattwise-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ---- Local LLM for offline AI dev (dev only) ----
  ollama:
    image: ollama/ollama:latest
    container_name: wattwise-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  clickhouse-data:
  grafana-data:
  ollama-data:
